{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}

{% block content %}
<h2>Регистрация</h2>
<form method="POST">
    <input type="text" name="username" placeholder="Имя пользователя" required maxlength="50">
    <input type="email" name="email" placeholder="Email" required maxlength="100">
    <input type="password" name="password" placeholder="Пароль (мин. 6 символов)" required>
    <input type="password" name="password2" placeholder="Повторите пароль" required>
    <button type="submit">Зарегистрироваться</button>
</form>
<p>Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
{% endblock %}
